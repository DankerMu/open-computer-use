# Isolated evaluation stack on a shared Docker host. Not part of any release.
# An override on the upstream docker-compose.yml and docker-compose.webui.yml;
# run it only through deploy/eval/start.sh and deploy/eval/stop.sh, which export
# ${EVAL_ROOT}/stack.env and ${EVAL_ROOT}/images.env and invoke:
#   docker compose -p ocu-eval --project-directory <checkout> --env-file <empty file> \
#     -f docker-compose.yml -f docker-compose.webui.yml -f deploy/eval/compose.eval.yml …
# Every object belongs to project ocu-eval. Only open-webui publishes, on loopback.
# The provider key reaches only open-webui and the adapter; the server speaks
# through the adapter with the adapter token.
# Sandboxes run with networking disabled, so they publish no port and reach no address.

services:
  # The workspace image is loaded from the release package; nothing is built.
  workspace:
    profiles: ["never"]

  # Upstream cleanup removes every orchestrator container and chat-*-workspace
  # volume on the host, including other projects' ones.
  cleanup:
    profiles: ["never"]

  computer-use-server:
    image: ${COMPUTER_USE_SERVER_IMAGE:?COMPUTER_USE_SERVER_IMAGE is required}
    build: !reset null
    container_name: ocu-eval-computer-use-server
    # The upstream dependency is the disabled workspace build job.
    depends_on: !reset {}
    ports: !override []
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock
      # Same host and container path: the daemon mounts chat data into sandboxes
      # by the path the orchestrator sees. start.sh creates it; a missing
      # directory fails instead of being created by the daemon.
      - type: bind
        source: ${EVAL_ROOT:?EVAL_ROOT is required}/data
        target: ${EVAL_ROOT:?EVAL_ROOT is required}/data
        bind:
          create_host_path: false
    environment: !override
      ENABLE_NETWORK: "false"
      BASE_DATA_DIR: ${EVAL_ROOT:?EVAL_ROOT is required}/data
      DOCKER_IMAGE: ${DOCKER_IMAGE:?DOCKER_IMAGE is required}
      MCP_API_KEY: ${MCP_API_KEY:?MCP_API_KEY is required}
      OCU_INTERNAL_TOKEN: ${OCU_INTERNAL_TOKEN:?OCU_INTERNAL_TOKEN is required}
      # Production's value (bootstrap-test.sh). The upstream 600-second default
      # would reap the sandbox of a run that makes no sandbox tool call for ten
      # minutes, in the middle of a render.
      CONTAINER_IDLE_TIMEOUT: "259200"
      # Speech through the evaluation adapter, which holds the provider key.
      # An empty voice lets the provider pick its default (mimo_default).
      TTS_BASE_URL: http://adapter:8090/v1
      TTS_MODEL: mimo-v2.5-tts
      TTS_VOICE: ""
      TTS_API_KEY: ${ADAPTER_TOKEN:?ADAPTER_TOKEN is required}

  # Evaluation-only adapter between OCU's speech client and dmxapi
  # (deploy/eval/adapter/eval_adapter.py). It reuses the server image's Python,
  # FastAPI, uvicorn and aiohttp; nothing is built. The entrypoint and command
  # replace the image's server preflight and server command, and the healthcheck
  # replaces the image's 8081 probe. Reachable only inside the project network.
  adapter:
    image: ${COMPUTER_USE_SERVER_IMAGE:?COMPUTER_USE_SERVER_IMAGE is required}
    container_name: ocu-eval-adapter
    # nobody: the bind is world-readable (start.sh checks it) and nothing is written.
    user: "65534:65534"
    working_dir: /eval-adapter
    entrypoint: ["python3", "-I", "-m", "uvicorn", "eval_adapter:app", "--app-dir", "/eval-adapter",
                 "--host", "0.0.0.0", "--port", "8090"]
    command: []
    volumes:
      - ./deploy/eval/adapter:/eval-adapter:ro
    environment:
      # start.sh reads it from the 0600 provider key file; stop.sh exports it empty.
      PROVIDER_KEY: ${EVAL_PROVIDER_KEY?EVAL_PROVIDER_KEY is required}
      ADAPTER_TOKEN: ${ADAPTER_TOKEN:?ADAPTER_TOKEN is required}
      UPSTREAM_BASE_URL: https://www.dmxapi.cn/v1
    healthcheck:
      # The slim image has no curl.
      test: ["CMD", "python3", "-I", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  open-webui:
    image: ${OPENWEBUI_IMAGE:?OPENWEBUI_IMAGE is required}
    container_name: ocu-eval-open-webui
    ports: !override
      - "127.0.0.1:${EVAL_WEBUI_PORT:?EVAL_WEBUI_PORT is required}:8080"
    environment: !override
      DATABASE_URL: postgresql://openwebui:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/openwebui
      # WebUI creates this admin during startup, before it serves, and disables
      # signup; open-webui-init then signs in as the existing admin. Without it
      # the first client to reach the port could sign up as admin.
      WEBUI_ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      WEBUI_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY is required}
      OPENAI_API_BASE_URL: https://www.dmxapi.cn/v1
      # Read by start.sh from the 0600 provider key file. stop.sh exports it
      # empty, because compose down interpolates it but never uses it.
      OPENAI_API_KEY: ${EVAL_PROVIDER_KEY?EVAL_PROVIDER_KEY is required}
      ENABLE_OLLAMA_API: "false"
      OFFLINE_MODE: "true"
      ENABLE_OCU_WORKSPACE: "true"
      OCU_INTERNAL_URL: http://computer-use-server:8081
      OCU_INTERNAL_TOKEN: ${OCU_INTERNAL_TOKEN:?OCU_INTERNAL_TOKEN is required}
      ENABLE_OCU_OFFICE_EDIT: "false"

  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    container_name: ocu-eval-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  # One-shot setup, as in deploy/production-like-test/compose.webui.override.yml:
  # installs the Computer Use tool and filters once the API is reachable.
  open-webui-init:
    image: ${OPENWEBUI_IMAGE:?OPENWEBUI_IMAGE is required}
    container_name: ocu-eval-open-webui-init
    user: "0:0"
    entrypoint: ["/bin/bash", "/bootstrap/run-init.sh"]
    depends_on:
      open-webui:
        condition: service_started
    environment:
      WEBUI_URL: http://open-webui:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ORCHESTRATOR_URL: http://computer-use-server:8081
      MCP_API_KEY: ${MCP_API_KEY:?MCP_API_KEY is required}
      PRIMARY_CHAT_MODEL: qwen3.8-27b
    volumes:
      - ./openwebui:/app/source:ro
      - ./deploy/production-like-test/init/run-init.sh:/bootstrap/run-init.sh:ro
      - open-webui-data:/app/backend/data
    security_opt:
      - no-new-privileges:true
    restart: "no"
