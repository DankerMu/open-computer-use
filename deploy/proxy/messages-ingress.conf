# Sandbox Messages ingress (#655). Static and secret-free: it holds no token
# and adds no identity; Open WebUI authenticates every forwarded request.
# Relative paths resolve against the nginx -p prefix, which must be writable
# by the unprivileged image user.
daemon off;
worker_processes 1;
pid messages-ingress.pid;
error_log stderr error;
events { worker_connections 1024; }
http {
    log_format messages_ingress '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout messages_ingress;
    client_body_temp_path client_body;
    proxy_temp_path proxy;
    server_tokens off;
    # Match the raw request line, not the normalised $uri: only POST to the
    # two Messages paths (any query) passes; dot segments, doubled slashes and
    # percent-encoded path bytes all fall through to 404.
    map "$request_method:$request_uri" $messages_ingress_denied {
        default 1;
        "~^POST:/api/v1/messages(?:/count_tokens)?(?:\?.*)?$" 0;
    }
    server {
        listen 8080;
        server_name _;
        merge_slashes off;
        # Applies to declared-length and chunked bodies before any upstream contact.
        client_max_body_size 32m;
        location = /healthz {
            if ($request_method != GET) { return 404; }
            default_type text/plain;
            return 200 "ok\n";
        }
        location ~ ^/api/v1/messages(?:/count_tokens)?$ {
            if ($messages_ingress_denied) { return 404; }
            proxy_pass http://open-webui:8080;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header x-api-key $http_x_api_key;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Accept $http_accept;
            proxy_set_header anthropic-version $http_anthropic_version;
            proxy_set_header anthropic-beta $http_anthropic_beta;
            proxy_set_header User-Agent $http_user_agent;
            # Server-sent events stream through unbuffered; long generations
            # keep the upstream connection for up to ten minutes per read/send.
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
        location / {
            return 404;
        }
    }
}
