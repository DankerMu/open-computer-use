#
# Remotion template tests: `npm ci` in remotion-template, then node:test over
# remotion-template/tests/. Standalone because build.yml is disabled and
# pushes images on main; this job builds and pushes nothing and reads no
# secrets.

name: template-tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  template-tests:
    # Pinned: ubuntu-latest moved to 26.04, whose ffmpeg is 8.0.1, not the
    # image's 6.1.1.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22.23.2'
      - name: Install ffmpeg
        # kit timeline's tests decode and normalize audio; Ubuntu 24.04's
        # ffmpeg is 6.1.1, the workspace image's version.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install template dependencies
        working-directory: remotion-template
        run: npm ci
      # kit data's table reader runs on python3; 3.12 is the workspace image's Python.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
      - name: Install openpyxl
        # kit data reads .xlsx files with openpyxl; 3.1.5 is the workspace image's pin.
        run: pip install openpyxl==3.1.5
      - name: Check openpyxl
        # The reader runs as python3 -I, so check the import the same way.
        run: python3 -I -c 'import openpyxl'
      - name: Run template tests
        # Quoted: node expands the glob itself; Node 22 does not expand directories.
        run: node --test "remotion-template/tests/*.test.mjs"
